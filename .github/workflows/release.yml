name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push das imagens
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr A-Z a-z)
          TAG=${{ github.ref_name }}
          docker build -f apps/api/Dockerfile -t ghcr.io/$OWNER/myeconomy-api:$TAG -t ghcr.io/$OWNER/myeconomy-api:latest .
          docker build -f apps/web/Dockerfile -t ghcr.io/$OWNER/myeconomy-web:$TAG -t ghcr.io/$OWNER/myeconomy-web:latest .
          docker push --all-tags ghcr.io/$OWNER/myeconomy-api
          docker push --all-tags ghcr.io/$OWNER/myeconomy-web
      - name: Pacote para download
        run: zip -r myeconomy-docker.zip docker-compose.yml .env.example README.md apps/api/prisma
      - uses: softprops/action-gh-release@v2
        with:
          files: myeconomy-docker.zip
          generate_release_notes: true
